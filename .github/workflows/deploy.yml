name: Deploy site (docs)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Proveri sadržaj
        run: |
          echo "--- docs ---"
          ls -la docs
          test -f docs/index.html || { echo "GRESKA: docs/index.html ne postoji"; exit 1; }

      - name: Pripremi
        run: |
          touch docs/.nojekyll
          cp docs/index.html docs/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
